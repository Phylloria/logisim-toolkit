[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logisim-toolkit"
version = "1.0.0"
description = "Standalone design, inspection, checking, and validation toolkit for Logisim 2.7.1"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Phylloria" }]
keywords = ["logisim", "digital-logic", "circuit", "cli", "testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Phylloria/logisim-toolkit"
Documentation = "https://github.com/Phylloria/logisim-toolkit/tree/main/docs"
Issues = "https://github.com/Phylloria/logisim-toolkit/issues"
Changelog = "https://github.com/Phylloria/logisim-toolkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
render = ["Pillow>=10"]

[project.scripts]
logisim-toolkit = "logisim_toolkit.cli:main"

[tool.setuptools]
packages = ["logisim_toolkit"]

[tool.setuptools.package-dir]
logisim_toolkit = "scripts"
