name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run regression
        run: python -m unittest discover -s tests -v

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Exercise installed console command
        run: |
          logisim-toolkit list-tools
          logisim-toolkit generate encoder-8to3 --out /tmp/encoder.circ
          logisim-toolkit check /tmp/encoder.circ --table /tmp/encoder_vectors.tsv --require-exhaustive
